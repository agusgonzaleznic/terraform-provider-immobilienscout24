name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  # Runs the same full-history scan as the schedule, on demand.
  workflow_dispatch:

# No job here writes to the repository, so the default token is narrowed to the
# minimum each one needs. CodeQL cannot upload its results without
# security-events: write, and it reads workflow metadata for its analysis of
# the workflows themselves, which is what actions: read is for.
permissions: {}

jobs:
  codeql:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          # The workflows, for injection and permission problems.
          - language: actions
            build-mode: none
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{ matrix.language }}"

  TruffleHog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No base or head: the action then picks the range from the event. A push
      # scans the pushed commits, a pull request its own commits, and the
      # schedule or a manual run the whole history. A fixed base of the default
      # branch equals HEAD on every push to main, and the action exits with
      # "BASE and HEAD commits are the same" without scanning anything.
      # The action runs the scanner image by tag, so the pin above does not pin
      # the scanner: version names its tag and digest (bump both with the
      # action). The config adds detectors for the ImmobilienScout24
      # credentials and PGP private keys, which the built-in ones miss.
      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          version: 3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
          extra_args: --config=.github/trufflehog.yml
